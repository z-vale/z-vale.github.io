colorScheme = 'slate'
defaultAppearance = 'light'
autoSwitchAppearance = true
enableSearch = true
enableCodeCopy = true
mainSections = ['posts']
robots = 'index, follow'
disableImageOptimization = false

[header]
  layout = 'basic'

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = 'profile'
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = '/posts/'
  cardView = false

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = false
  showReadingTime = true
  showWordCount = false
  showTableOfContents = true
  showTaxonomies = true
  showBreadcrumbs = true
  showPagination = true
  showRelatedContent = false
  showEdit = false
  showComments = false

[list]
  showSummary = true
  showCards = false
  groupByYear = true
  cardView = false

[taxonomy]
  showTermCount = true

[term]
  groupByYear = true
