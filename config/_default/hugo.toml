baseURL = 'https://z-vale.github.io/'
theme = 'blowfish'
defaultContentLanguage = 'zh-cn'
timeZone = 'Asia/Shanghai'
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 100
buildDrafts = false
buildFuture = false
enableEmoji = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = 'tags'
  category = 'categories'

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[caches.images]
  dir = ':cacheDir/images'
